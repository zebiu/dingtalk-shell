<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>钉钉</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg style="display:none" aria-hidden="true">
    <symbol id="i-ai" viewBox="0 0 24 24"><path d="M12 3l2.1 5.9L20 11l-5.9 2.1L12 19l-2.1-5.9L4 11l5.9-2.1z"/><path d="M19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/></symbol>
    <symbol id="i-msg" viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 01-7.5 7.5H9l-4.5 2.5V17A7.5 7.5 0 1112 4a7.5 7.5 0 018 7.5z"/><path d="M8.5 10.5h7M8.5 13.5h4.5"/></symbol>
    <symbol id="i-meet" viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5l6-3v9l-6-3z"/></symbol>
    <symbol id="i-listen" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21M8.5 21h7"/><path d="M20 8v6M3 8v6"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol>
    <symbol id="i-sheet" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/></symbol>
    <symbol id="i-app" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="2.5"/><path d="M7.5 19c1.2-2.2 2.6-3.2 4.5-3.2s3.3 1 4.5 3.2"/></symbol>
    <symbol id="i-todo" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M7.5 12l3 3 6-6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3z"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M5 9v6h4l5 4V5L9 9z"/><path d="M17 9l4 6M21 9l-4 6"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.2"/><path d="M16 14c2.8 0 5 2.2 5 5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/><path d="M12 14v7"/></symbol>
    <symbol id="i-emoji" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c.9 1.2 2.1 1.8 3.5 1.8s2.6-.6 3.5-1.8"/><circle cx="9" cy="9.5" r=".9"/><circle cx="15" cy="9.5" r=".9"/></symbol>
    <symbol id="i-like" viewBox="0 0 24 24"><path d="M7 10v10H4V10zM7 10l4-7c1.6 0 2.4 1 2.2 2.4L12.8 9H19c1.3 0 2.1 1.2 1.8 2.4l-1.6 6.6c-.2 1-1 1.8-2 1.8H7"/></symbol>
    <symbol id="i-at" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a2.5 2.5 0 005 0v-1a9 9 0 10-3.5 7.1"/></symbol>
    <symbol id="i-scissor" viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="6" cy="17" r="2.5"/><path d="M8 9l12 10M8 15L20 5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="M4 18l5-5 3.5 3.5L16 13l4 4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l4.5 4.5L19 7"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4.5L21 20H3z"/><path d="M12 10v4.5M12 17.5v.3"/></symbol>
    <!-- 以下按原版钉钉 PC 的细线性图标补齐：会话头、工具栏、快捷胶囊 -->
    <symbol id="i-megaphone" viewBox="0 0 24 24"><path d="M4 10v4a1 1 0 001 1h3l8 4V5L8 9H5a1 1 0 00-1 1z"/><path d="M19 9a4 4 0 010 6"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.5 3.5h3l1.5 4-2 1.5a12 12 0 006 6l1.5-2 4 1.5v3a2 2 0 01-2.2 2A16.5 16.5 0 014.5 5.7a2 2 0 012-2.2z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h5l2 2h7a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></symbol>
    <symbol id="i-user-plus" viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c0-3.6 2.9-6.5 6.5-6.5 1.3 0 2.5.4 3.5 1"/><path d="M18 14v6M15 17h6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1-2 3.4-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5H14V22a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.9.3l-.1.1-2-3.4.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H7.5v-4h.4a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1 2-3.4.1.1a1.7 1.7 0 001.9.3 1.7 1.7 0 001-1.5V3h2v.4a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1 2 3.4-.1.1a1.7 1.7 0 00-.3 1.9 1.7 1.7 0 001.5 1h.4v4h-.4a1.7 1.7 0 00-1.7 1.1z"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 6.3"/><path d="M20 4v7h-7"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M17 12v3M20 12v2"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9S9.5 5.5 12 3z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 12a7.5 7.5 0 01-7.5 7.5H8l-4 2.5v-4.6A7.5 7.5 0 1112 4.5 7.5 7.5 0 0120 12z"/><path d="M8.5 11h7M8.5 14h4.5"/></symbol>
    <symbol id="i-font" viewBox="0 0 24 24"><path d="M4 19L9.5 5h2L17 19"/><path d="M6 14h9"/><path d="M18 12h3M19.5 10.5v3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-checkbox" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M7.5 12l3 3 6-6"/></symbol>
  </svg>

  <div class="app">
    <!-- 30px 自绘标题栏：搜索框居中 + 窗口按钮 -->
    <header class="titlebar">
      <div class="tb-left"></div>
      <div class="tb-search">
        <svg class="ic"><use href="#i-search"/></svg>
        <span>搜索或提问 (Ctrl+Shift+F)</span>
      </div>
      <div class="win-controls">
        <button class="wbtn" data-ctl="min" title="最小化"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
        <button class="wbtn" data-ctl="max" title="最大化"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7"/></svg></button>
        <button class="wbtn close" data-ctl="close" title="关闭"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
      </div>
    </header>

    <!-- 142px 左导航：用户卡片 + 横排导航项 -->
    <nav class="rail">
      <div class="me" id="me" title="点击修改显示的姓名和组织名">
        <div class="me-avatar" id="meAvatar">我</div>
        <div class="me-text">
          <div class="me-name" id="meName">我</div>
          <div class="me-org" id="meOrg">我的组织</div>
        </div>
        <svg class="ic me-arrow"><use href="#i-chevron"/></svg>
      </div>

      <div class="me-editor" id="meEditor" hidden>
        <label>显示姓名<input id="inputName" maxlength="16" placeholder="姓名" /></label>
        <label>组织名称<input id="inputOrg" maxlength="30" placeholder="组织名" /></label>
        <div class="me-editor-tip">仅保存在本机，只影响这个窗口的显示</div>
        <div class="me-editor-actions">
          <button id="btnReset" type="button">恢复默认</button>
          <button id="btnSave" type="button" class="primary">保存</button>
        </div>
      </div>

      <div class="rail-items" id="railItems"></div>

      <div class="rail-bottom">
        <div class="key-tip">
          <div class="key-tip-title">添加通行密钥</div>
          <div class="key-tip-desc">使用通行密钥登录无需记住复杂的密码，是最安全更快捷的登录方式</div>
          <div class="key-tip-actions"><span>立即添加</span><span id="closeKeyTip">×</span></div>
        </div>
      </div>
    </nav>

    <!-- 240px 会话列表 -->
    <aside class="list">
      <div class="list-head">
        <button class="filter-btn" title="筛选"><svg class="ic"><use href="#i-filter"/></svg></button>
        <div class="tabs">
          <button class="tab active" data-tab="all">消息 <b>99+</b></button>
          <button class="tab" data-tab="unread">未读 <b>99+</b></button>
        </div>
      </div>
      <div class="conv-list" id="convList"></div>
    </aside>

    <!-- 聊天区：会话头 + webview + 输入区 -->
    <main class="chat">
      <div class="chat-head">
        <div class="chat-title-wrap">
          <div class="chat-title"><span id="chatTitle">项目协作群</span><svg class="ic chat-title-monitor" title="电脑端在线"><use href="#i-monitor"/></svg><span class="chat-count" id="chatCount">73</span><span class="chat-tag">内部群</span></div>
          <div class="chat-sub" id="chatSub">内部沟通 · 工作空间</div>
        </div>
        <div class="chat-actions">
          <!-- 本壳的扩展功能全部收进「…」菜单；这里只保留隐藏的原按钮，
               菜单项通过转发 click 复用原有逻辑与状态 -->
          <div class="tool-group" id="toolGroup" aria-hidden="true">
            <button class="view-btn" id="btnSync" title="强制刷新页面并重新抓取全部帖子；网页模式下刷新当前页"><svg class="ic"><use href="#i-refresh"/></svg><span>刷新</span></button>
            <button class="view-btn" id="btnLogin" title="打开网页模式登录该站点">登录</button>
            <button class="view-btn" id="viewSwitch" title="切换显示网页 / 消息">网页</button>
            <button class="view-btn on" id="btnMask" title="掩饰已开启：左栏备注与会话名显示为工作群聊，点此查看真实内容">掩饰</button>
            <button class="view-btn on" id="btnRaw" title="把网页内容转成钉钉消息气泡；点此查看网站原页">IM 包装</button>
          </div>
          <span class="act-sep"></span>
          <button title="语音通话"><svg class="ic"><use href="#i-phone"/></svg></button>
          <button title="群文件"><svg class="ic"><use href="#i-folder"/></svg></button>
          <button title="添加成员"><svg class="ic"><use href="#i-user-plus"/></svg></button>
          <button title="搜索聊天记录"><svg class="ic"><use href="#i-search"/></svg></button>
          <button title="更多" id="btnMore" aria-haspopup="menu" aria-expanded="false"><svg class="ic"><use href="#i-more"/></svg></button>
          <button title="设置"><svg class="ic"><use href="#i-settings"/></svg></button>
        </div>
      </div>

      <div class="chat-body">
        <div class="chat-view" id="chatView"></div>
        <!-- 不指定 partition：沿用 Electron 默认的持久化 session，
             登录 cookie 与已通过的站点验证态都能跨重启保留 -->
        <webview id="frame" src="about:blank" allowpopups></webview>
        <div class="loading" id="loading"><span>加载中…</span></div>
        <div class="newmsg" id="newmsg" title="点击打开网页模式"><svg class="ic"><use href="#i-check"/></svg><span>正在同步…</span></div>
        <!-- 原版钉钉在消息区左下、输入区上方常驻「待办 / 看闲忙」两个小胶囊 -->
        <div class="chat-shortcuts">
          <button title="待办"><svg class="ic"><use href="#i-checkbox"/></svg>待办</button>
          <button title="看闲忙"><svg class="ic"><use href="#i-clock"/></svg>看闲忙</button>
          <button title="更多"><svg class="ic"><use href="#i-more"/></svg></button>
        </div>
      </div>

      <div class="composer">
        <div class="composer-tools">
          <span class="composer-label">我的评论区</span>
          <button title="表情"><svg class="ic"><use href="#i-emoji"/></svg></button>
          <button title="点赞"><svg class="ic"><use href="#i-like"/></svg></button>
          <button title="@"><svg class="ic"><use href="#i-at"/></svg></button>
          <button title="字体"><svg class="ic"><use href="#i-font"/></svg></button>
          <button class="dot" title="截图"><svg class="ic"><use href="#i-scissor"/></svg></button>
          <button title="图片"><svg class="ic"><use href="#i-image"/></svg></button>
          <button title="待办"><svg class="ic"><use href="#i-checkbox"/></svg></button>
          <button title="更多"><svg class="ic"><use href="#i-plus"/></svg></button>
        </div>
        <div class="composer-input"><textarea id="composerInput" placeholder="写下你的评论…" spellcheck="false"></textarea></div>
        <div class="composer-foot">
          <span>Enter 发送 · Shift+Enter 换行 · 仅保存在本机，不会发到网站</span>
          <button class="send" id="btnSend">发送(S)</button>
        </div>
      </div>
    </main>
  </div>

  <!-- 「…」下拉：刷新 / 登录 / 网页 / 掩饰 / IM 包装，固定定位避免被会话头裁切 -->
  <div class="more-menu" id="moreMenu" role="menu" hidden>
    <div class="mm-head">更多操作</div>
    <button role="menuitem" data-target="btnSync"><svg class="ic"><use href="#i-refresh"/></svg><span>刷新页面并重新抓取</span><em class="mm-state"></em></button>
    <button role="menuitem" data-target="btnLogin"><svg class="ic"><use href="#i-key"/></svg><span>登录当前站点</span><em class="mm-state"></em></button>
    <div class="mm-line"></div>
    <button role="menuitem" data-target="viewSwitch"><svg class="ic"><use href="#i-globe"/></svg><span>网页 / 消息</span><em class="mm-state"></em></button>
    <button role="menuitem" data-target="btnMask"><svg class="ic"><use href="#i-eye"/></svg><span>掩饰</span><em class="mm-state"></em></button>
    <button role="menuitem" data-target="btnRaw"><svg class="ic"><use href="#i-chat"/></svg><span>IM 包装</span><em class="mm-state"></em></button>
    <div class="mm-foot">仅影响本机显示，不会修改网站内容</div>
  </div>

  <script src="crawlers.js"></script>
  <script src="packer.js"></script>
  <script src="app.js"></script>
</body>
</html>
